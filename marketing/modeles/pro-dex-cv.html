<!doctype html>
<html><head><meta charset="utf-8">
<!-- Style pro, mise en page « documents annotés » : CV et lettre réels, flèches vers ce qui fait la différence. -->
<link rel="stylesheet" href="/marketing/modeles/_pro.css">
<style>
body{background:#e9eef6;color:#0b1a33}
.logo{height:92px;top:50px}
.tag{position:absolute;top:84px;right:72px;font-size:20px;font-weight:800;letter-spacing:3px;color:#1E6FD9}
.titre{top:180px;font-size:70px;color:#0F2A4A}
.titre span{color:#1E6FD9}
.lettre{position:absolute;left:520px;top:430px;width:400px;transform:rotate(5deg);box-shadow:0 30px 60px -15px rgba(15,42,74,.45);border-radius:6px}
.cv{position:absolute;left:150px;top:400px;width:440px;transform:rotate(-3deg);box-shadow:0 40px 70px -15px rgba(15,42,74,.55);border-radius:6px;z-index:2}
.note{position:absolute;z-index:3;background:#0F2A4A;color:#fff;font-size:22px;font-weight:700;padding:12px 18px;border-radius:12px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.note i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#2F86FF;display:grid;place-items:center;font-size:17px}
.n1{left:40px;top:470px}.n2{left:60px;top:800px}.n3{right:40px;top:640px}
.prix{position:absolute;left:72px;right:72px;top:1050px;display:flex;align-items:center;justify-content:space-between}
.prix div small{display:block;font-size:20px;font-weight:800;letter-spacing:3px;color:#4b5b75}
.prix div b{font-family:Anton;font-weight:400;font-size:84px;line-height:1;color:#0F2A4A}
.prix div b i{font-style:normal;font-size:34px;margin-left:6px}
.prix p{font-size:24px;font-weight:700;color:#0F2A4A;text-align:right;line-height:1.4}
.pied{background:#0F2A4A;color:#e6eeff;height:160px}.pied svg{color:#79b0ff}
</style></head><body>
<img class="logo" src="/assets/img/logo-dex-marque-t.png">

<div class="titre">Un CV qui donne<br><span>envie de vous appeler</span></div>

<img class="cv" src="/assets/img/dex/cv.jpg">

<div class="prix"><div><small>CV + LETTRE DÈS</small><b>1 500<i>FCFA</i></b></div><p>Version anglaise<br>en mode 3</p></div>
