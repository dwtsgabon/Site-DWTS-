body::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.08) 1.5px,transparent 1.8px) 0 0/30px 30px;-webkit-mask:linear-gradient(90deg,#000,transparent 60%)}

.marque{position:absolute;top:84px;right:72px;font-size:20px;font-weight:700;letter-spacing:3px;color:#cfe0ff}
.titre{top:190px;font-size:72px;width:940px}
.titre span{color:#9fd8ff}
.photo{position:absolute;right:-70px;top:330px;width:640px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%);filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
.prix{position:absolute;left:72px;top:360px}

.liste div{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700}
.liste svg{width:34px;height:34px;flex:none}
.capture{position:absolute;left:72px;top:870px;width:460px;border-radius:14px;overflow:hidden;border:6px solid #fff;box-shadow:0 30px 60px rgba(0,0,0,.45);transform:rotate(-2deg)}
.capture img{display:block;width:100%}
.capture span{position:absolute;left:0;top:0;background:#22D3EE;color:#04121c;font-size:17px;font-weight:800;padding:6px 12px;border-radius:0 0 10px 0}
.pied{background:#071a3a;color:#e6eeff;height:160px}
.pied svg{color:#22D3EE}
