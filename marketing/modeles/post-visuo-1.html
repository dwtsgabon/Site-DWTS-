<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Inter,sans-serif;color:#f5f5f7;overflow:hidden;
 background:radial-gradient(800px 600px at 90% 5%,rgba(139,61,255,.55) 0%,rgba(139,61,255,0) 60%),radial-gradient(700px 600px at 0% 100%,rgba(255,106,0,.35) 0%,rgba(255,106,0,0) 60%),#0a0a0b}
.top{position:absolute;top:56px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center}
.top img{height:80px}
.tag{font-size:24px;font-weight:700;letter-spacing:3px;color:#ff8a3d;border:2px solid #ff8a3d;padding:10px 22px;border-radius:40px}
h1{position:absolute;top:180px;left:70px;right:70px;font-size:96px;line-height:1;font-weight:900;letter-spacing:-3px}
h1 span{background:linear-gradient(120deg,#FF6A00,#ffb067);-webkit-background-clip:text;color:transparent}
.sub{position:absolute;top:400px;left:70px;right:70px;font-size:34px;color:#c9c9cf;font-weight:500}
.grid{position:absolute;top:490px;left:70px;right:70px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid div{height:280px;border-radius:20px;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.grid img{width:100%;height:100%;object-fit:cover}
.grid b{position:absolute;left:14px;top:14px;width:52px;height:52px;border-radius:50%;background:#FF6A00;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.cta{position:absolute;bottom:56px;left:70px;right:70px;background:linear-gradient(120deg,#FF6A00,#8B3DFF);border-radius:28px;padding:28px 40px;display:flex;justify-content:space-between;align-items:center}
.cta b{font-size:36px;font-weight:800}
.cta span{font-size:32px;font-weight:600}
.badges{position:absolute;left:70px;right:70px;display:flex;gap:12px;flex-wrap:nowrap;white-space:nowrap}.badges span{font-size:25px;font-weight:800;padding:10px 18px;border-radius:40px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25)}.badges .price{background:#fff;color:#0a0a0b;border-color:#fff}
.badges{top:1094px}
</style></head><body>
<div class="top"><img src="assets/img/logo-visuo-clair.png"><div class="tag">CONCEPTION</div></div>
<h1>Bien vue,<br><span>bien vendue.</span></h1>
<p class="sub">Logos, affiches, flyers, visuels réseaux, sites web.</p>
<div class="grid">
 <div><img src="assets/img/visuo/conference-entrepreneuriat.jpg"><b>1</b></div>
 <div><img src="assets/img/visuo/identite.jpg"><b>2</b></div>
 <div><img src="assets/img/visuo/camp-jeunesse.jpg"><b>3</b></div>
 <div><img src="assets/img/visuo/site-web.jpg"><b>4</b></div>
</div>
<div class="badges"><span class="price">Affiche dès 2 500 XAF</span><span class="price">Logo dès 6 500 XAF</span><span>✅ Aperçu avant paiement</span></div>
<div class="cta"><b>Commander sur WhatsApp</b><span>062 67 14 45</span></div>
</body></html>
